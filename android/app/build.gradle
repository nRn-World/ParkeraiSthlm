apply plugin: 'com.android.application'

// Signering av release-bygget (den .aab som laddas upp till Google Play).
//
// Nyckeln och lösenorden ligger utanför versionshanteringen och läses i första hand från
// android/keystore.properties (som git ignorerar), annars från miljövariablerna nedan –
// de används av molnbygget. Saknas båda blir bygget osignerat i stället för att krascha,
// så att ett vanligt `gradlew assembleDebug` alltid fungerar.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = keystoreProperties["storeFile"] ?: System.getenv("PARKERA_KEYSTORE_FILE")
def releaseStorePassword = keystoreProperties["storePassword"] ?: System.getenv("PARKERA_KEYSTORE_PASSWORD")
def releaseKeyAlias = keystoreProperties["keyAlias"] ?: System.getenv("PARKERA_KEY_ALIAS")
def releaseKeyPassword = keystoreProperties["keyPassword"] ?: System.getenv("PARKERA_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

// Versionsnumret kan sättas av molnbygget; standardvärdet är det som ligger i repot.
// Google Play kräver ett högre versionCode för varje uppladdning.
def buildVersionCode = (System.getenv("PARKERA_VERSION_CODE") ?: "1") as Integer
def buildVersionName = System.getenv("PARKERA_VERSION_NAME") ?: "1.0"

android {
    namespace = "one.nrnworld.parkisthlm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "one.nrnworld.parkisthlm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Ingen signeringsnyckel hittades (android/keystore.properties eller PARKERA_KEYSTORE_*). Release-bygget blir osignerat och kan inte laddas upp till Google Play.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
