name: Android-bygge

# Bygger den signerade appbunten (.aab) som laddas upp till Google Play.
#
# Körs manuellt (Actions → Android-bygge → Run workflow) eller när en tagg som börjar på
# "android-" skickas upp:  git tag android-1.0.0 && git push origin android-1.0.0
#
# Signeringsnyckeln läggs in som hemligheter i repot (Settings → Secrets and variables →
# Actions). Se docs/GOOGLE_PLAY.md för hur de skapas:
#   ANDROID_UPLOAD_KEYSTORE_BASE64     nyckelfilen, base64-kodad
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD   lösenordet för nyckelfilen
#   ANDROID_UPLOAD_KEY_ALIAS           alias, normalt "upload"
#   ANDROID_UPLOAD_KEY_PASSWORD        lösenordet för nyckeln
# Saknas de blir bygget osignerat och artefakten kan inte laddas upp – då syns en varning
# i loggen i stället för att arbetsflödet misslyckas.
on:
  workflow_dispatch:
  push:
    tags:
      - "android-*"

jobs:
  appbunt:
    name: Signerad .aab
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 (kravet från Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Beroenden enligt package-lock.json
        run: npm ci

      - name: Ikoner och startbilder
        run: npm run assets:native

      - name: Bygg webbappen för den inbyggda appen
        run: npm run build:native

      - name: Synka in i Android-projektet
        run: npx cap sync android

      - name: Skriv uppladdningsnyckeln
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "PARKERA_KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Höj versionsnumret
        run: echo "PARKERA_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Bygg appbunten
        env:
          PARKERA_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          PARKERA_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          PARKERA_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --console=plain --no-daemon

      - name: Kontrollera att bunten blev signerad
        run: |
          cd android/app/build/outputs/bundle/release
          jarsigner -verify -verbose app-release.aab | tail -5
          ls -la

      - name: Spara bunten
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
